name: Validate Cloud Platform library

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: ${{ runner.temp }}/launchpad-no-config
      AWS_SHARED_CREDENTIALS_FILE: ${{ runner.temp }}/launchpad-no-credentials
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint and test offline
        run: |
          python -m ruff check .
          python -m pytest -q
