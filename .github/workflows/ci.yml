name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate platform
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_CONFIG_FILE: ${{ runner.temp }}/no-aws-config
      AWS_SHARED_CREDENTIALS_FILE: ${{ runner.temp }}/no-aws-credentials
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint and test
        run: |
          python -m ruff check .
          python -m pytest -q
      - name: Build and verify the installed wheel
        run: |
          python -m build --wheel --outdir .build/dist
          python -m pip install --force-reinstall --no-deps .build/dist/*.whl
          python -c "from importlib.metadata import version; from cdk_launchpad.constructs import SecureBucket, DocumentProcessor; print(version('cdk-launchpad'))"
          cdk-launchpad-validate --help
          python -m pytest -q
