[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cdk-launchpad"
version = "0.1.0"
description = "Local shared CDK constructs for the Partenamut interview demo"
requires-python = ">=3.12"
dependencies = ["aws-cdk-lib==2.273.0", "constructs==10.8.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
cache_dir = ".cache/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
cache-dir = ".cache/ruff"

[tool.ruff.lint]
select = ["E", "F", "I"]

